version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
      time: "04:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "fix(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "04:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "fix(deps)"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "05:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "fix(deps)"
