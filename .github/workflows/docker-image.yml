name: Build and Deploy NixOS Docker Image

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'
  push:
    branches: [main, master]

permissions:
  contents: write          # <-- was 'read'
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FALLBACK_TAG: dev
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}     # prefer github.token over secrets.GITHUB_TOKEN

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ... your build steps ...

      - name: Check if GitHub Release exists
        id: check_release
        run: |
          echo "🔎 Checking for existing release v${{ env.NIX_VERSION }}…"
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v${{ env.NIX_VERSION }}")
          echo "create_release=$([[ $status == 404 ]] && echo true || echo false)" >> $GITHUB_ENV

      - name: Create GitHub Release
        if: env.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.NIX_VERSION }}
          name: NixOS Docker Image v${{ env.NIX_VERSION }}
          body: |
            🚀 NixOS Docker image version **${{ env.NIX_VERSION }}** has been built and pushed to:
            • GitHub Container Registry
            • Docker Hub
          draft: false
          prerelease: false
          token: ${{ github.token }}         # <-- explicit; action defaults to this anyway
