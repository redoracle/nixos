name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint GitHub Actions workflows
        run: |
          docker run --rm --volume "$PWD:/repo:ro" --workdir /repo \
            rhysd/actionlint:1.7.12 -color
      - name: Check POSIX shell syntax
        run: sh -n install_nix.sh tests/*.sh
      - name: Run ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --shell=sh install_nix.sh tests/*.sh
      - name: Test installer contract
        run: sh tests/test-installer.sh
      - name: Set up Node.js 24 for release-tool verification
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install release tooling dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify release dependency compatibility
        run: npm ls --depth=0
      - name: Verify release-notes generation and compatibility
        run: npm run test:release-notes
      - name: Validate maintenance and release scripts
        run: |
          node --check scripts/prepare-release.mjs
          node --check scripts/check-release.mjs
          node --check scripts/check-release-notes.mjs
          node --check scripts/cleanup-branches.mjs
          node scripts/check-release.mjs
          node --test tests/branch-cleanup.test.mjs tests/branch-cleanup-api.test.mjs tests/pi-needle.test.mjs
          node --check ai/needle-policy.mjs
          node --check ai/needle-cli.mjs
          node --check ai/needle-engine.mjs
          node --check ai/needle-predictions.mjs
          node --check ai/needle-selection.mjs
          node --check ai/needle-pi-extension.js

  container:
    name: Container ${{ matrix.platform }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        run: docker buildx build --platform '${{ matrix.platform }}' --load --tag alpine-nix:ci .
      - name: Smoke-test Nix and writable store
        run: docker run --rm -i alpine-nix:ci sh -s < tests/smoke.sh
      - name: Build opt-in Pi and Needle variant
        run: |
          docker buildx build --builder default --platform '${{ matrix.platform }}' --load \
            --file Dockerfile.pi --build-arg BASE_IMAGE=alpine-nix:ci \
            --tag alpine-nix-pi:ci .
      - name: Execute every catalog entry under the unprivileged image user
        run: docker run --rm -i alpine-nix-pi:ci node --input-type=module - < tests/pi-catalog-smoke.mjs
      - name: Smoke-test Pi and offline Needle inference
        run: docker run --rm -i alpine-nix-pi:ci sh -s < tests/pi-smoke.sh
